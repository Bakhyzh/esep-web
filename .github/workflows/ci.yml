name: CI

# main is built and checked by deploy.yml as well; this workflow guards pull requests
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan committed frontend sources
        run: |
          mkdir -p /tmp/frontend-scan
          git archive HEAD src e2e docs .env.platform.example README.md .github/workflows/ci.yml | tar -x -C /tmp/frontend-scan
          docker run --rm -v /tmp/frontend-scan:/scan:ro ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f dir /scan --redact --no-banner
